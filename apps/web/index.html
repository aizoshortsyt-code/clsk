<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CLSK Mini App</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#111827;color:#f9fafb;font:16px system-ui}main{max-width:560px;margin:auto;padding:32px 20px}.card{background:#1f2937;border-radius:20px;padding:24px}button{border:0;border-radius:12px;padding:12px 18px;background:#2ea6ff;color:#fff;font-size:16px}</style></head><body><main><div class="card"><h1>CLSK</h1><p>Минимальный Telegram Mini App запущен.</p><p id="user">Пользователь: гость</p><p id="status">Проверка API...</p><button id="close">Закрыть</button></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const u=tg?.initDataUnsafe?.user;if(u)document.querySelector('#user').textContent=`Пользователь: ${u.first_name||u.username||'Telegram'}`;fetch('http://localhost:4000/health').then(r=>r.json()).then(d=>document.querySelector('#status').textContent=d.ok?'API работает':'API недоступен').catch(()=>document.querySelector('#status').textContent='API недоступен');document.querySelector('#close').onclick=()=>tg?.close();</script></body></html>
