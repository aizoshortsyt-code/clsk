<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLSK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121b2d;
        --panel-2: #1a2740;
        --accent: #5ab4ff;
        --accent-2: #73e0a3;
        --text: #eef6ff;
        --muted: #9db2c9;
        --danger: #ff7582;
        --shadow: rgba(0,0,0,0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(180deg, #0b1020 0%, #111827 100%);
        color: var(--text);
        font-family: Inter, Segoe UI, system-ui, sans-serif;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      .card {
        background: rgba(18, 27, 45, 0.96);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 22px;
        box-shadow: 0 18px 40px var(--shadow);
        overflow: hidden;
      }

      .hero {
        padding: 22px 20px 12px;
        background: linear-gradient(135deg, rgba(90,180,255,0.15), rgba(115,224,163,0.12));
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .pill {
        display: inline-block;
        background: rgba(90,180,255,0.18);
        color: var(--accent);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 6px;
        font-size: clamp(2rem, 5vw, 2.5rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .body {
        padding: 18px 20px 20px;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 14px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 14px 16px;
      }

      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        color: #0b1020;
      }

      .profile-info {
        flex: 1;
        min-width: 0;
      }

      .name {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 3px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(115,224,163,0.12);
        color: var(--accent-2);
        border: 1px solid rgba(115,224,163,0.35);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 14px rgba(115,224,163,0.8);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 16px;
        padding: 12px 14px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 10px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 14px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary {
        background: linear-gradient(135deg, var(--accent), #3f8df7);
        color: white;
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .danger {
        background: rgba(255,117,130,0.12);
        color: #ffb3bc;
        border: 1px solid rgba(255,117,130,0.25);
      }

      .note {
        margin-top: 18px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="hero">
          <span class="pill">CLSK</span>
          <h1>Mini App</h1>
          <p class="subtitle">Эффективный рабочий кабинет для задач, команд и KPI.</p>
        </div>

        <div class="body">
          <div class="profile">
            <div class="avatar" id="avatar">U</div>
            <div class="profile-info">
              <p class="name" id="user-name">Гость</p>
              <div class="meta" id="user-meta">Telegram profile not loaded</div>
            </div>
            <div class="status" id="auth-status">guest</div>
          </div>

          <div class="grid">
            <div class="stat">
              <div class="stat-label">Команды</div>
              <div class="stat-value">12</div>
            </div>
            <div class="stat">
              <div class="stat-label">Задачи</div>
              <div class="stat-value">86</div>
            </div>
            <div class="stat">
              <div class="stat-label">Выполнено</div>
              <div class="stat-value">64%</div>
            </div>
            <div class="stat">
              <div class="stat-label">Ожидает</div>
              <div class="stat-value">31</div>
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="start-btn">Начать работу</button>
            <button class="secondary" id="profile-btn">Профиль</button>
            <button class="danger" id="close-btn">Закрыть Mini App</button>
          </div>

          <div class="note" id="note">
            Приложение готово к запуску. Если открыто внутри Telegram, будет использован профиль пользователя.
          </div>
        </div>
      </section>
    </main>

    <script>
      const tg = window.Telegram?.WebApp;
      const userName = document.getElementById('user-name');
      const userMeta = document.getElementById('user-meta');
      const authStatus = document.getElementById('auth-status');
      const avatar = document.getElementById('avatar');
      const note = document.getElementById('note');

      const fallbackName = 'Гость';

      function setGuest() {
        userName.textContent = fallbackName;
        userMeta.textContent = 'Telegram profile not loaded';
        authStatus.textContent = 'guest';
        avatar.textContent = 'G';
      }

      async function loadTelegramUser() {
        if (!tg) {
          setGuest();
          return;
        }

        tg.ready();
        tg.expand();

        const initData = tg.initData || '';

        try {
          const response = await fetch(`http://localhost:4000/api/me?initData=${encodeURIComponent(initData)}`);
          const data = await response.json();

          if (data.user) {
            const user = data.user;
            const firstName = user.first_name || user.username || 'Telegram';
            const lastName = user.last_name || '';
            const fullName = [firstName, lastName].filter(Boolean).join(' ');

            userName.textContent = fullName || 'Telegram User';
            userMeta.textContent = user.username ? `@${user.username}` : 'Telegram profile';
            authStatus.textContent = 'verified';
            avatar.textContent = (firstName || 'T').charAt(0).toUpperCase();
            note.textContent = 'Telegram profile подтверждён сервером. Mini App готов к работе.';
            return;
          }
        } catch (error) {
          console.error('Telegram user load failed', error);
        }

        setGuest();
      }

      document.getElementById('start-btn').addEventListener('click', () => {
        note.textContent = 'Начинаем работу: создана новая сессия CLSK.';
      });

      document.getElementById('profile-btn').addEventListener('click', () => {
        note.textContent = 'Профиль: отображаем Telegram-пользователя и текущий режим доступа.';
      });

      document.getElementById('close-btn').addEventListener('click', () => {
        if (tg?.close) tg.close();
      });

      loadTelegramUser();
    </script>
  </body>
</html>
