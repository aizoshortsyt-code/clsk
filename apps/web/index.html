<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLSK Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#121f33; --panel2:#1b2d47; --text:#f4f8ff; --muted:#9bb0c8; --blue:#4da9ff; --green:#70e2a0; --red:#ff7885; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0,#183b5f 0,transparent 36%),var(--bg); color:var(--text); font:15px Inter,Segoe UI,system-ui,sans-serif; }
    main { width:min(100% - 32px,620px); margin:auto; padding:28px 0 42px; }
    .brand { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; } .logo { font-size:28px; font-weight:900; letter-spacing:.08em; } .badge { color:var(--green); background:#70e2a01c; border:1px solid #70e2a055; border-radius:99px; padding:7px 11px; font-size:12px; }
    .hero,.profile,.stat,.activity { background:linear-gradient(145deg,#14253b,#0f1b2d); border:1px solid #ffffff12; border-radius:22px; box-shadow:0 16px 40px #0004; }
    .hero { padding:26px; margin-bottom:14px; } h1 { margin:0 0 8px; font-size:clamp(28px,7vw,42px); } .hero p { margin:0; color:var(--muted); line-height:1.55; }
    .profile { padding:18px; display:flex; align-items:center; gap:14px; } .avatar { flex:0 0 58px; width:58px; height:58px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--green)); color:#071321; font-size:24px; font-weight:900; } .profile-main { min-width:0; flex:1; } .name { margin:0 0 4px; font-size:19px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .meta { margin:0; color:var(--muted); font-size:13px; } .verified { color:var(--green); font-size:12px; margin-top:6px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; } .stat { padding:14px 10px; text-align:center; } .stat b { display:block; font-size:24px; margin-bottom:6px; } .stat span { color:var(--muted); font-size:11px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; } button { border:0; border-radius:14px; padding:14px 12px; color:var(--text); background:var(--panel2); border:1px solid #ffffff14; font-weight:800; cursor:pointer; } button.primary { background:linear-gradient(135deg,var(--blue),#3478eb); } button.stop { background:#ff78851c; color:#ffadb5; } button:disabled { opacity:.5; cursor:wait; }
    .activity { padding:17px; } .activity h2 { margin:0 0 8px; font-size:16px; } #message { margin:0; color:var(--muted); line-height:1.5; } .session { color:var(--green); font-size:13px; margin-top:8px; }
    @media (max-width:420px) { .grid { grid-template-columns:repeat(2,1fr); } .actions { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="logo">CLSK</div><div class="badge" id="mode">Подключение…</div></div>
    <section class="hero"><h1>Рабочий кабинет</h1><p>Управляй командами, задачами и результатами в одном месте.</p></section>
    <section class="profile"><div class="avatar" id="avatar">G</div><div class="profile-main"><p class="name" id="name">Гость</p><p class="meta" id="meta">Загрузка профиля…</p><div class="verified" id="verified">Проверяем Telegram-профиль</div></div></section>
    <section class="grid"><div class="stat"><b id="teams">—</b><span>Команды</span></div><div class="stat"><b id="tasks">—</b><span>Задачи</span></div><div class="stat"><b id="completed">—</b><span>Выполнено %</span></div><div class="stat"><b id="pending">—</b><span>Ожидает</span></div></section>
    <div class="actions"><button class="primary" id="start">Начать работу</button><button id="profile">Обновить профиль</button><button class="stop" id="stop">Остановить сессию</button><button id="close">Закрыть Mini App</button></div>
    <section class="activity"><h2>Статус</h2><p id="message">Подключаемся к API…</p><div class="session" id="session"></div></section>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const api = '__CLSK_API_URL__';
    const initData = tg?.initData || '';
    const $ = id => document.getElementById(id);
    function render(data) {
      const user = data.user;
      const first = user?.first_name || user?.username || 'Гость';
      $('name').textContent = user ? [first, user.last_name].filter(Boolean).join(' ') : 'Гость';
      $('meta').textContent = user?.username ? '@' + user.username : user ? 'Telegram-профиль' : 'Открой приложение через Telegram для входа';
      $('avatar').textContent = first[0].toUpperCase();
      $('mode').textContent = data.mode === 'verified' ? 'Авторизован' : 'Гостевой режим';
      $('verified').textContent = data.mode === 'verified' ? '✓ Профиль подтверждён сервером' : 'Гостевой режим — данные не привязаны к аккаунту';
      $('teams').textContent = data.stats.teams; $('tasks').textContent = data.stats.tasks; $('completed').textContent = data.stats.completed; $('pending').textContent = data.stats.pending;
      $('session').textContent = data.session.active ? '● Рабочая сессия активна' : '○ Рабочая сессия не запущена';
      $('message').textContent = data.mode === 'verified' ? 'Профиль загружен. Доступ к рабочему кабинету открыт.' : 'Для персонального профиля открой Mini App из Telegram.';
    }
    async function request(path, method='GET') {
      const options = { method, headers: {'Content-Type':'application/json'} };
      if (method !== 'GET') options.body = JSON.stringify({initData});
      const url = `${api}${path}${method === 'GET' ? '?initData=' + encodeURIComponent(initData) : ''}`;
      const response = await fetch(url, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'API error'); return data;
    }
    async function load() { try { render(await request('/api/me')); } catch (e) { $('message').textContent = 'API недоступен: ' + e.message; } }
    async function action(path) { const button = event.currentTarget; button.disabled = true; try { const data = await request(path, 'POST'); render(data); $('message').textContent = data.message; } catch(e) { $('message').textContent = 'Ошибка: ' + e.message; } finally { button.disabled = false; } }
    $('start').onclick = e => { event = e; action('/api/session/start'); }; $('stop').onclick = e => { event = e; action('/api/session/stop'); }; $('profile').onclick = load; $('close').onclick = () => tg?.close(); load();
  </script>
</body>
</html>
